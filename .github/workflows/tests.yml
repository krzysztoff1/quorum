name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  test:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Update test-count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(swift test --list-tests | grep -c '^QuorumCoreTests')
          current=$(sed -n -E 's#.*badge/tests-([0-9]+)-brightgreen.*#\1#p' README.md)
          [ "$count" = "$current" ] && exit 0
          sed -i '' -E "s#(badge/tests-)[0-9]+#\1${count}#" README.md
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Update test count badge [skip ci]"
          git push
